name: SwipeGallery

options:
  bundleIdPrefix: com.samuelecozza
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: it
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SwipeCore:
    type: framework
    platform: iOS
    sources:
      - path: SwipeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelecozza.swipegallery.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  SwipeGallery:
    type: application
    platform: iOS
    sources:
      - path: SwipeGallery
    dependencies:
      - target: SwipeCore
    settings:
      base:
        PRODUCT_NAME: SwipeGallery
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelecozza.swipegallery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SwipeGallery
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SwipeGallery accede alle tue foto per aiutarti a decidere quali tenere ed eliminare.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO

  SwipeCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwipeCoreTests
    dependencies:
      - target: SwipeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelecozza.swipegallery.coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SwipeGallery:
    build:
      targets:
        SwipeGallery: all
        SwipeCoreTests: [test]
    test:
      config: Debug
      targets:
        - SwipeCoreTests
    run:
      config: Debug
    archive:
      config: Release
